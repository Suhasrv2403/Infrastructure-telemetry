# ==========================================================================================
# Signal catalog v0 -- Supercharger stall & cabinet (P0-10)
# ==========================================================================================
#
# PROVENANCE (P1-08): this file is copied verbatim from branch P0-10-signal-catalog-v0's
# catalog/signals.yaml (worktree .worktrees/P0-10-signal-catalog-v0), not authored fresh in
# this branch. Stage 2 canonicalization (pipeline/stage2_canonical/) reads it as-is. All
# 'DRAFT, NOT REVIEWED' caveats below are that source file's own and still apply unchanged -
# nothing here has been SME-reviewed by P1-08.
#
# STATUS: DRAFT, NOT REVIEWED. catalog_status below is the machine-readable flag; in words --
# nobody with real Supercharger firmware knowledge has looked at this file yet. Every
# canonical_name, unit, description and valid_range here is inferred by reading the SYNTHETIC
# fixture generator's source code (tests/fixtures/generators/supercharger.py), not real device
# payloads or real firmware documentation, because real Supercharger payload/firmware access
# doesn't exist yet (see that module's own docstring). Treat this as a firmware SME's starting
# point to correct, not as ground truth. Do not build P1-03/P1-04 real parsers against this
# file's semantics without that review; the *shape* (one entry per field, per firmware) is
# reusable now, the *content* is a best-effort guess.
#
# What "top 3 firmware per class" means here (P0-10, Build backlog.md): the generator only
# models 3 supercharger_stall firmware versions (2.1.4, 2.3.0, 3.0.1) and 2 supercharger_cabinet
# firmware versions (1.8.2, 1.9.0) -- see DEFAULT_FIRMWARE in the generator. "Top 3" is
# therefore "all of them" for both classes; there is no ranking/selection being done, and this
# file makes no claim about real-world firmware prevalence.
#
# Firmware-identical schema note: the generator does not vary reading *field names/types* by
# firmware version (only timing/loss behavior via FIRMWARE_QUIRK_MULTIPLIER). So every firmware
# version within a device_class gets an identical field list below (YAML anchors keep that from
# being copy-pasted three times). Real firmware almost certainly diverges per version -- this
# is a known simplification of the synthetic source, not a claim about real hardware, and is
# exactly the kind of thing a firmware SME review should catch.
#
# Structure (kept close to the pre-existing skeleton this file replaces):
#   <device_class>:
#     "<firmware_version>":
#       <raw_field_name>:
#         canonical_name: <string>     # stable name for Stage 2 onward; often == raw_field_name
#         kind: signal | envelope_adjacent   # "envelope_adjacent" = not a physical measurement,
#                                             # but part of Stage 1's merge key (see below)
#         unit: <string>                # explicit unit, or none/enum/bool/count for non-physical
#         type: float | int | bool | enum | string
#         enum_values: [...]            # present only when type: enum, or an int with a fixed
#                                        # code set (e.g. fault_code)
#         nullable: true|false          # present only when the field can legitimately be null
#         description: <string>         # physical/semantic meaning, as read off the generator
#         valid_range: [min, max] | null  # inferred from the generator's own value-generation
#                                          # logic where possible; null when not numeric/bounded
#         source_ref: <string>          # exact generator function + line of logic this entry
#                                        # was derived from, so a reviewer can check the claim
#
# Renames from the generator's raw field names (documented per instructions -- use judgment,
# note any rename):
#   - stall "state"      -> canonical "session_state"   (generic "state" collides across device
#                                                          classes once this feeds one canonical
#                                                          schema; "session_state" is unambiguous)
#   - stall "fault_code"    -> canonical "stall_fault_code"
#   - cabinet "fault_code"  -> canonical "cabinet_fault_code"
#     (both fault_code fields use *different, class-specific* code spaces -- 1001/1042/2010 for
#     stalls vs 3001/3002 for cabinets -- so a shared canonical "fault_code" column would silently
#     conflate two different meanings; kept device_ts_ms/payload_hash unrenamed since CLAUDE.md
#     invariant 2 names them exactly that.)
#   - everything else (output_voltage_v, output_current_a, output_power_kw, connector_temp_c,
#     energy_delivered_kwh, session_id, grid_voltage_v, grid_frequency_hz, transformer_temp_c,
#     contactor_closed, active_stall_count, aggregate_power_kw, device_ts_ms, payload_hash) is
#     already reasonably named (several already unit-suffixed) and kept as-is.
#
# device_ts_ms and payload_hash are listed under every firmware because Stage 1's merge key is
# (device_id, device_ts_ms, payload_hash) (CLAUDE.md invariant 2) and every reading carries both
# -- but they are envelope-adjacent bookkeeping, not physical signals, hence kind: envelope_adjacent.

catalog_status: v0_draft_unreviewed
catalog_version: 0
source_generator: tests/fixtures/generators/supercharger.py

supercharger_stall:
  "2.1.4": &supercharger_stall_fields
    session_id:
      canonical_name: session_id
      kind: signal
      unit: none
      type: string
      description: >
        Opaque identifier for the charging session this reading belongs to. Stable across all
        readings in one session, changes between sessions on the same device.
      valid_range: null
      source_ref: "_simulate_stall_session: f'sess-{device_id}-{session_index}'"

    state:
      canonical_name: session_state
      kind: signal
      unit: enum
      type: enum
      enum_values: [plugged_in, charging, fault, session_complete]
      description: >
        Charging-session lifecycle state at the time of this reading. First reading of a
        session (absent a fault) is plugged_in; middle readings are charging; the final
        reading of a session that completes without a fault is session_complete; once a fault
        occurs, that reading and (in this generator) the session ends there.
      valid_range: null
      source_ref: "_simulate_stall_session: state assignment (plugged_in / charging / fault / session_complete)"

    output_voltage_v:
      canonical_name: output_voltage_v
      kind: signal
      unit: volts
      type: float
      description: >
        Charger DC output voltage delivered to the vehicle at the connector. Modeled as
        effectively constant for an entire session (drawn once per session, not varied
        reading-to-reading).
      valid_range: [390.0, 410.0]
      source_ref: "_simulate_stall_session: voltage_v = rng.uniform(390, 410), rounded to 1 decimal; reused for every reading in the session"

    output_current_a:
      canonical_name: output_current_a
      kind: signal
      unit: amps
      type: float
      description: >
        Charger DC output current at the connector. Ramps up over the first 10% of the
        session, holds near peak for the middle ~65%, tapers over the final 25%; forced to
        exactly 0.0 once session_state is fault.
      valid_range: [0.0, 257.5]
      source_ref: "_simulate_stall_session: peak_current_a = rng.uniform(120, 250); current_a = peak_current_a * ramp * rng.uniform(0.97, 1.03); 0.0 when state == 'fault'"

    output_power_kw:
      canonical_name: output_power_kw
      kind: signal
      unit: kilowatts
      type: float
      description: >
        Instantaneous charger output power. Derived, not independently measured in the
        generator: output_voltage_v * output_current_a / 1000. 0.0 during a fault.
      valid_range: [0.0, 105.6]
      source_ref: "_simulate_stall_session: power_kw = voltage_v * current_a / 1000, rounded to 2 decimals"

    connector_temp_c:
      canonical_name: connector_temp_c
      kind: signal
      unit: celsius
      type: float
      description: >
        Modeled connector/cable temperature. Loosely coupled to output_power_kw plus random
        noise in the generator, not an independent physical simulation.
      valid_range: [29.0, 43.7]
      source_ref: "_simulate_stall_session: round(30 + power_kw * 0.12 + rng.uniform(-1, 1), 1)"

    energy_delivered_kwh:
      canonical_name: energy_delivered_kwh
      kind: signal
      unit: kilowatt_hours
      type: float
      description: >
        Cumulative energy delivered so far in the current session. Resets to 0.0 at the start
        of each new session; monotonically non-decreasing within a session (accumulates
        output_power_kw * reading_interval / 3600 each reading).
      valid_range: [0.0, null]
      source_ref: "_simulate_stall_session: energy_kwh += power_kw * interval_s / 3600, rounded to 3 decimals; no fixed upper bound modeled"

    fault_code:
      canonical_name: stall_fault_code
      kind: signal
      unit: enum
      type: int
      enum_values: [0, 1001, 1042, 2010]
      description: >
        0 = no fault. Nonzero: simulated fault categories -- 1001 (generator comment: "module
        fault"), 1042 ("thermal"), 2010 ("comms"). These labels are the generator author's
        commentary, not a real Supercharger fault-code registry; real meanings and real code
        values need firmware SME confirmation.
      valid_range: null
      source_ref: "_simulate_stall_session: fault_code = rng.choice([1001, 1042, 2010]) once fault_at is reached, else 0"

    device_ts_ms:
      canonical_name: device_ts_ms
      kind: envelope_adjacent
      unit: milliseconds_since_epoch
      type: int
      nullable: true
      description: >
        Device-reported reading timestamp (Unix epoch ms) as received, before Stage 1
        timestamp-sanity checks (P1-05). Not a physical signal -- it is the second component
        of Stage 1's merge key (device_id, device_ts_ms, payload_hash), CLAUDE.md invariant 2.
        Can be null (missing), 0 (epoch-default), or far in the future; these are injected
        messiness the generator models (P0-07 profiling target), not a real clock-fault
        taxonomy.
      valid_range: null
      source_ref: "_apply_timestamp_corruption / _finalize_readings"

    payload_hash:
      canonical_name: payload_hash
      kind: envelope_adjacent
      unit: none
      type: string
      description: >
        sha1-derived hash of this reading's own field values (computed before device_ts_ms/
        payload_hash are attached), used as the third component of Stage 1's merge key so a
        verbatim retransmission of the same reading collapses to one row. Not a physical
        signal.
      valid_range: null
      source_ref: "_payload_hash: 'sha1:' + sha1(canonical json of fields)[:16]"

  "2.3.0": *supercharger_stall_fields
  "3.0.1": *supercharger_stall_fields

supercharger_cabinet:
  "1.8.2": &supercharger_cabinet_fields
    grid_voltage_v:
      canonical_name: grid_voltage_v
      kind: signal
      unit: volts
      type: float
      description: >
        Grid-side AC voltage measured at the cabinet's utility connection.
      valid_range: [475.0, 485.0]
      source_ref: "_simulate_cabinet_stream: round(rng.uniform(475, 485), 1)"

    grid_frequency_hz:
      canonical_name: grid_frequency_hz
      kind: signal
      unit: hertz
      type: float
      description: >
        Grid-side AC frequency measured at the cabinet's utility connection.
      valid_range: [59.9, 60.1]
      source_ref: "_simulate_cabinet_stream: round(rng.uniform(59.9, 60.1), 3)"

    transformer_temp_c:
      canonical_name: transformer_temp_c
      kind: signal
      unit: celsius
      type: float
      description: >
        Modeled cabinet transformer temperature. Loosely coupled to aggregate_power_kw plus
        random noise in the generator, not an independent physical simulation.
      valid_range: [34.0, 60.0]
      source_ref: "_simulate_cabinet_stream: round(35 + aggregate_power_kw * 0.05 + rng.uniform(-1, 1), 1)"

    contactor_closed:
      canonical_name: contactor_closed
      kind: signal
      unit: bool
      type: bool
      description: >
        Whether the cabinet's main contactor is closed (delivering power) at the time of this
        reading. False exactly when this reading's fault_code is nonzero.
      valid_range: null
      source_ref: "_simulate_cabinet_stream: contactor_closed = (fault_code == 0)"

    active_stall_count:
      canonical_name: active_stall_count
      kind: signal
      unit: count
      type: int
      description: >
        Modeled number of stalls served by this cabinet that are actively drawing power at
        the time of reading. Follows a rough daily demand curve peaking around hour-of-day 17.
      valid_range: [0, 8]
      source_ref: "_simulate_cabinet_stream: active_stalls = max(0, round(rng.uniform(0, 8) * demand_factor)), demand_factor in [0.3, 1.0]"

    aggregate_power_kw:
      canonical_name: aggregate_power_kw
      kind: signal
      unit: kilowatts
      type: float
      description: >
        Modeled total power draw across all stalls this cabinet is currently serving. 0.0
        whenever active_stall_count is 0.
      valid_range: [0.0, 480.0]
      source_ref: "_simulate_cabinet_stream: round(active_stalls * rng.uniform(40, 60), 1)"

    fault_code:
      canonical_name: cabinet_fault_code
      kind: signal
      unit: enum
      type: int
      enum_values: [0, 3001, 3002]
      description: >
        0 = no fault. Nonzero: simulated cabinet fault categories 3001, 3002. Generator
        commentary only -- no real meaning assigned yet; needs firmware SME confirmation.
      valid_range: null
      source_ref: "_simulate_cabinet_stream: fault_code = 0 if rng.random() > 0.01 else rng.choice([3001, 3002])"

    device_ts_ms:
      canonical_name: device_ts_ms
      kind: envelope_adjacent
      unit: milliseconds_since_epoch
      type: int
      nullable: true
      description: >
        Device-reported reading timestamp (Unix epoch ms) as received, before Stage 1
        timestamp-sanity checks (P1-05). Not a physical signal -- second component of Stage
        1's merge key (device_id, device_ts_ms, payload_hash), CLAUDE.md invariant 2. Can be
        null, 0 (epoch-default), or far in the future -- injected messiness the generator
        models (P0-07), not a real clock-fault taxonomy.
      valid_range: null
      source_ref: "_apply_timestamp_corruption / _finalize_readings"

    payload_hash:
      canonical_name: payload_hash
      kind: envelope_adjacent
      unit: none
      type: string
      description: >
        sha1-derived hash of this reading's own field values, used as the third component of
        Stage 1's merge key so a verbatim retransmission of the same reading collapses to one
        row. Not a physical signal.
      valid_range: null
      source_ref: "_payload_hash: 'sha1:' + sha1(canonical json of fields)[:16]"

  "1.9.0": *supercharger_cabinet_fields

# ==========================================================================================
# Megapack / Powerpack (prep work for P2-13, "Megapack and Powerpack parsers, incl. cell-level
# child table"; catalog sign-off itself is P2-14's job per catalog/README.md and Build
# backlog.md - this block just gives P2-13/P2-14 something concrete to build against, the same
# way the Supercharger block above gave P1-03/P1-04/P1-08 something concrete before real
# Supercharger telemetry existed).
# ==========================================================================================
#
# PROVENANCE: added directly on branch prep-megapack-powerpack-fixtures, NOT copied from an
# earlier branch (unlike the Supercharger block above, which was copied verbatim from
# P0-10-signal-catalog-v0 per that block's own PROVENANCE note). This is genuinely new content,
# written by reading tests/fixtures/generators/megapack_powerpack.py's own source - the
# SYNTHETIC fixture generator built alongside this catalog block on the same branch - not real
# device payloads or real firmware documentation, because real Megapack/Powerpack payload/
# firmware access doesn't exist yet (same situation the Supercharger block describes).
#
# STATUS: DRAFT, NOT REVIEWED (catalog_status: v0_draft_unreviewed below, shared with the
# Supercharger block - there's only one catalog_status flag in this file. See that flag's use
# above; nothing in this block has been reviewed either). Every canonical_name, unit,
# description, valid_range and enum_values here is this generator/catalog author's own
# reasonable-guess judgment about grid-scale battery storage telemetry - informed by publicly
# known Megapack/Powerpack product facts (utility-scale battery + power conversion system,
# pack-level dispatch, per-cell/per-cell-group BMS monitoring), not a real Tesla spec sheet or
# firmware capture. Treat this exactly like the Supercharger block: a concrete starting point
# for a firmware SME to correct (P2-14), not ground truth. Do not build real P2-13 parsers
# against this file's semantics without that review.
#
# What "top firmware versions" means here (P2-13's done-when language): the generator only
# models 2 firmware versions per product (megapack: 1.42.3, 1.44.0; powerpack: 1.19.2, 1.21.0)
# - see DEFAULT_FIRMWARE in megapack_powerpack.py. As with the Supercharger block, "top N" is
# therefore "all of them" here; no real-world firmware prevalence ranking is being claimed.
#
# THE CELL-LEVEL CHILD TABLE (the structurally new part P2-13's done-when calls out: "cell
# table partitioned and compacted"):
# Megapack and Powerpack are physically composed of many battery cells/cell groups, each
# reporting voltage/temperature at a much coarser cadence than pack-level telemetry. This is
# modeled below as two GENUINELY SEPARATE device classes per product, not extra pack-row
# columns:
#   - megapack / powerpack:            pack-level parent stream, keyed (device_id, device_ts_ms)
#   - megapack_cell / powerpack_cell:  cell-level child stream, keyed (device_id, cell_id,
#                                       device_ts_ms) - see the flagged merge-key gap below.
# A cell-level message reuses its parent pack device's device_id and firmware_version (same
# physical unit's BMS, a second stream) - only device_class differs. See
# megapack_powerpack.py's own module docstring for the full reasoning, including why the child
# stream's cell_count is NOT a literal per-cell count (real BMS telemetry realistically reports
# at a cell-group/monitoring-channel granularity to bound volume - see that docstring's "Cell
# count modeling" section) and why cell-level cadence is a fixed multiple
# (CELL_REPORTING_RATIO=12) coarser than pack-level cadence.
#
# FLAGGED GAP for whoever builds P2-13's real Stage 1 table for the cell child stream (not
# resolved by this prep ticket): CLAUDE.md invariant 2 states Stage 1's MERGE key is
# (device_id, device_ts, payload_hash) - it says nothing about cell_id. In this generator's
# synthetic output that 3-part key still happens to work, because payload_hash is computed over
# each cell reading's own fields (which include cell_id), so two cells at the same
# device_ts_ms get different payload_hash values and don't collide. But the cell child table's
# intended, human-legible key is (device_id, cell_id, device_ts_ms) - relying on payload_hash
# uniqueness as an implicit stand-in for an explicit cell_id key component is fragile and worth
# a real design decision (docs/decisions/) once P2-13 actually builds this table for real.
#
# Firmware-identical schema note: same simplification as the Supercharger block - the generator
# does not vary reading field names/types by firmware version within a product (only
# timing/loss behavior via FIRMWARE_QUIRK_MULTIPLIER), so every firmware version within a
# device_class gets an identical field list below via YAML anchors, same as above.
#
# Grid-side vs device-side ranges: grid_voltage_v/grid_frequency_hz are modeled as properties of
# the grid a device is tied to, not of the device/product itself, so megapack and powerpack
# deliberately share identical valid_range values for these two fields rather than inventing an
# unjustified per-product difference - see megapack_powerpack.py's GRID_VOLTAGE_RANGE /
# GRID_FREQUENCY_RANGE module constants.
#
# Renames from the generator's raw field names (same judgment-call convention as the
# Supercharger block above):
#   - megapack/powerpack "fault_code" -> canonical "megapack_fault_code" / "powerpack_fault_code"
#     (each uses a different, product-specific code space - 4101/4220/4355 for megapack vs
#     5101/5220 for powerpack - so a shared canonical "fault_code" column would silently
#     conflate two different meanings, exactly the same reasoning the stall/cabinet
#     fault_code rename above already uses.)
#   - everything else (pack_soc_pct, pack_voltage_v, pack_current_a, pack_power_kw,
#     dispatch_setpoint_kw, inverter_status, ambient_temp_c, max_cell_temp_c, min_cell_temp_c,
#     grid_voltage_v, grid_frequency_hz, energy_charged_kwh, energy_discharged_kwh, cell_id,
#     cell_voltage_v, cell_temp_c, balancing_active, device_ts_ms, payload_hash) is already
#     reasonably named (unit-suffixed where physical) and kept as-is.
#
# Sign convention worth flagging for a reviewer: pack_power_kw and dispatch_setpoint_kw use
# POSITIVE = charging (power flowing into the pack) / NEGATIVE = discharging (power flowing out
# to the grid) - i.e. "net power into the pack", the convention this generator's own
# _simulate_pack_readings function uses internally. This is the opposite sign convention from
# some real BMS/PCS implementations (which use positive = discharge/export) - flagging
# explicitly so a firmware SME reviewing this doesn't assume one convention or the other without
# checking; get this confirmed against real firmware before treating sign as ground truth.

megapack:
  "1.42.3": &megapack_fields
    pack_soc_pct:
      canonical_name: pack_soc_pct
      kind: signal
      unit: percent
      type: float
      description: >
        Pack-level state of charge. Modeled with headroom rather than a hard 0-100% band (real
        BMS systems typically reserve margin for cell longevity) and driven by a simplified
        peak-shaving dispatch cycle (charge overnight, discharge the evening peak) - see
        _dispatch_profile in the generator.
      valid_range: [5.0, 98.0]
      source_ref: "_simulate_pack_readings: soc integrated from delta_soc_pct = actual_kw * interval_s/3600 / pack_energy_kwh * 100, clamped to SOC_RANGE"

    pack_voltage_v:
      canonical_name: pack_voltage_v
      kind: signal
      unit: volts
      type: float
      description: >
        Pack-level DC bus voltage. Loosely coupled to pack_soc_pct (higher soc -> slightly
        higher terminal voltage) plus noise around a per-device baseline drawn once - not an
        independent physical simulation, same disclaimer style as the Supercharger block's
        connector_temp_c/transformer_temp_c entries.
      valid_range: [595.0, 905.0]
      source_ref: "_simulate_pack_readings: voltage_v = base_voltage + (soc-50)/50 * (voltage_span*0.05) + rng.uniform(-1.5, 1.5), clamped near PRODUCT_SPECS['megapack'].pack_voltage_range"

    pack_current_a:
      canonical_name: pack_current_a
      kind: signal
      unit: amps
      type: float
      description: >
        Pack-level DC current, derived (not independently simulated): pack_power_kw * 1000 /
        pack_voltage_v. Same sign convention as pack_power_kw (positive = charging).
      valid_range: [-3200.0, 3200.0]
      source_ref: "_simulate_pack_readings: current_a = actual_kw * 1000 / voltage_v; approximate bound from pack_power_kw_max=1900 over the low end of pack_voltage_range"

    pack_power_kw:
      canonical_name: pack_power_kw
      kind: signal
      unit: kilowatts
      type: float
      description: >
        Actual delivered pack power. POSITIVE = charging (power into the pack), NEGATIVE =
        discharging (power out to the grid) - see this file's sign-convention note above. Can
        differ from dispatch_setpoint_kw when curtailed (see inverter_status) or during a fault
        (forced to 0.0).
      valid_range: [-1900.0, 1995.0]
      source_ref: "_simulate_pack_readings: actual_kw, from setpoint_kw = pack_power_kw_max * frac * rng.uniform(0.9, 1.05), then possibly curtailed or zeroed on fault"

    dispatch_setpoint_kw:
      canonical_name: dispatch_setpoint_kw
      kind: signal
      unit: kilowatts
      type: float
      description: >
        Commanded power target from the (simulated) dispatch cycle, same sign convention as
        pack_power_kw. Unlike pack_power_kw, NOT reduced by curtailment - it is the command, not
        the delivered result, which is exactly what makes a curtailment episode visible
        (dispatch_setpoint_kw far from pack_power_kw while inverter_status is "curtailed").
      valid_range: [-1995.0, 1995.0]
      source_ref: "_simulate_pack_readings: setpoint_kw, set before curtailment/fault are applied to actual_kw"

    inverter_status:
      canonical_name: inverter_status
      kind: signal
      unit: enum
      type: enum
      enum_values: [standby, charging, discharging, fault, curtailed]
      description: >
        Power-conversion-system (inverter/PCS) status at the time of this reading. "curtailed"
        means a simulated grid-operator curtailment order reduced actual delivered power well
        below dispatch_setpoint_kw while discharging - a grid-interconnection behavior the
        Supercharger generator has no analog for.
      valid_range: null
      source_ref: "_simulate_pack_readings: inverter_status assignment (dispatch_profile state, or 'curtailed'/'fault' overrides)"

    ambient_temp_c:
      canonical_name: ambient_temp_c
      kind: signal
      unit: celsius
      type: float
      description: >
        Modeled site ambient temperature (a site/weather property, not a device property - see
        this file's shared-range note above; shared value range with powerpack). Drawn once per
        device as a baseline, jittered per reading.
      valid_range: [-22.0, 47.0]
      source_ref: "_simulate_pack_readings: ambient_temp_c = ambient_base + rng.uniform(-2.0, 2.0), ambient_base from AMBIENT_TEMP_RANGE=(-20.0, 45.0)"

    max_cell_temp_c:
      canonical_name: max_cell_temp_c
      kind: signal
      unit: celsius
      type: float
      description: >
        Pack-level rollup: hottest simulated cell temperature at this reading. Loosely coupled
        to ambient_temp_c plus load (|pack_power_kw| / pack_power_kw_max) plus noise - not
        derived from the cell-level child table's own cell_temp_c values, and not guaranteed
        consistent with them (a known simplification of this generator, not a real BMS
        rollup computation).
      valid_range: [-22.0, 65.0]
      source_ref: "_simulate_pack_readings: max_cell_temp_c = ambient_temp_c + load_frac*15.0 + rng.uniform(0.0, 3.0)"

    min_cell_temp_c:
      canonical_name: min_cell_temp_c
      kind: signal
      unit: celsius
      type: float
      description: >
        Pack-level rollup: coldest simulated cell temperature at this reading. Same caveat as
        max_cell_temp_c - not derived from the cell-level child table's own readings.
      valid_range: [-24.0, 47.0]
