# Checkov suppressions for known, accepted findings across this repo's Terraform modules.
#
# Why a config file instead of inline `# checkov:skip=` comments: verified against checkov
# 3.3.20 (installed fresh, run for real - not assumed) that CKV_AWS_111, CKV_AWS_109,
# CKV_AWS_356, CKV_AWS_18, CKV_AWS_144, CKV2_AWS_61, CKV2_AWS_62, and CKV2_AWS_5 do NOT honor
# inline skip comments in this checkov version - tested placement directly above the data
# source, above the consuming resource, and in isolated single-purpose test files, and all were
# ignored (the finding still reports FAILED). CKV_AWS_382 and CKV2_AWS_64 do honor inline
# comments, but every suppression is centralized here anyway so this file is the single source
# of truth for "what's accepted and why," instead of splitting it between .tf comments (which
# silently do nothing for some check IDs) and this file.
#
# --- Root-grant KMS key policies (networking's flow_logs_kms, object_store's object_store_kms) ---
# CKV_AWS_111 / CKV_AWS_109 / CKV_AWS_356: both policies grant the account root kms:* on
# resources = ["*"] - the standard AWS-default KMS key policy shape. A KMS key policy's own
# resource element is inherently "*" (the key has no ARN yet at policy-authoring time, since the
# policy is what creates it), so these are permanent false positives for this common pattern,
# not an actual over-broad grant. Tighten with real per-role statements before a real
# (non-LocalStack) apply, per org KMS conventions.
# CKV2_AWS_64 ("Ensure KMS key policy is defined"): a policy IS attached on both keys via the
# `policy` argument - checkov's graph scanner can't statically resolve it through the
# aws_iam_policy_document data source's .json output. Known false positive for this pattern.
#
# --- Networking module ---
# CKV2_AWS_5 ("Ensure Security Groups are attached to another resource"): aws_security_group
# "internal" is intentionally provisioned ahead of any compute - P0-02's scope is the
# networking/IAM baseline only. P0-04 (orchestrator) and P1-01 (ingest service) attach compute
# to it later via the internal_security_group_id output. An SG with nothing attached yet is
# expected at this stage, not an oversight.
# CKV_AWS_382 ("Ensure no security groups allow egress from 0.0.0.0:0 to port -1"): the internal
# SG's open egress is a deliberate placeholder - pipeline services need general internet egress
# (package registries, provider APIs) and there's no NAT/VPC-endpoint design yet to scope it
# further. Revisit once P1-01/P0-04 define what egress compute actually needs; track narrowing
# this in docs/decisions/ before a real (non-LocalStack) apply.
#
# --- Object store module (both landing and warehouse buckets) ---
# CKV_AWS_18 ("Ensure the S3 bucket has access logging enabled"): access logging isn't designed
# yet - there's no logging bucket or retention policy for it in this repo. Add one when a
# logging pipeline is actually designed, not as a bolt-on here.
# CKV_AWS_144 ("Ensure S3 bucket has cross-region replication enabled"): out of scope for the
# MVP (single region). Revisit before a real (non-LocalStack) apply per docs/decisions/0001.
# CKV2_AWS_61 ("Ensure S3 bucket has a lifecycle configuration"): lifecycle configuration
# (compaction/retention tiering) is explicitly P1-02's ticket, not P0-02/P0-03's.
# CKV2_AWS_62 ("Ensure S3 buckets should have event notifications enabled"): event notifications
# aren't needed until something consumes them (e.g. triggering Stage 1 parsing) - out of scope
# for P0-03's layout/catalog goal.
skip-check:
  - CKV_AWS_111
  - CKV_AWS_109
  - CKV_AWS_356
  - CKV2_AWS_64
  - CKV2_AWS_5
  - CKV_AWS_382
  - CKV_AWS_18
  - CKV_AWS_144
  - CKV2_AWS_61
  - CKV2_AWS_62
